<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="1100" viewBox="0 0 1410 1100" role="img"><title>Talk2Me journaling mockup — three screen states</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#526675"/></marker></defs><rect x="0" y="0" width="1410" height="1100" rx="0" fill="white" stroke="none" stroke-width="1"/><rect x="48" y="44" width="8" height="54" rx="4" fill="#087E80" stroke="none" stroke-width="1"/><text x="76" y="79" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" text-anchor="start">Record a spoken journal entry</text><text x="76" y="115" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">UC-J01 · Three states of one goal · Recording and transcription stay on the device</text><text x="60" y="165" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">01  Ready</text><text x="510" y="165" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">02  Recording</text><text x="960" y="165" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">03  Saved with transcript</text><rect x="60" y="190" width="390" height="800" rx="28" fill="#F3F6F8" stroke="#CFDCE3" stroke-width="2"/><text x="85" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="425" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="end">●  ▰</text><text x="85" y="269" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">talk2me</text><text x="85" y="307" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Your journal</text><text x="85" y="341" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">English · Example learner profile</text><rect x="197" y="968" width="116" height="5" rx="3" fill="#152C3A" stroke="none" stroke-width="1"/><text x="255" y="413" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle">A moment to speak</text><text x="255" y="450" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Tell us about your day.</text><text x="255" y="474.0" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Speak for 30 seconds to 2 minutes.</text><circle cx="255" cy="572" r="71" fill="#E6F5F2" stroke="none" stroke-width="1"/><rect x="244" y="538" width="22" height="40" rx="11" fill="none" stroke="#087E80" stroke-width="3"/><path d="M235,559 v10 a20,20 0 0 0 40,0 v-10 M255,589 v13 M243,602 h24" fill="none" stroke="#087E80" stroke-width="3" stroke-linecap="round"/><text x="255" y="692" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" text-anchor="middle">00:00</text><text x="255" y="730" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Ready when you are</text><rect x="85" y="782" width="340" height="55" rx="13" fill="#087E80" stroke="none" stroke-width="1"/><text x="255.0" y="817" fill="white" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Record</text><text x="255" y="878" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Your audio stays on this device.</text><text x="255" y="900.5" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Recording also works offline.</text><rect x="510" y="190" wi