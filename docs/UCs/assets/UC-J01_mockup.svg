t="32" rx="3" fill="#087E80" stroke="none" stroke-width="1"/><rect x="734" y="493.5" width="7" height="73" rx="3" fill="#087E80" stroke="none" stroke-width="1"/><rect x="752" y="506.0" width="7" height="48" rx="3" fill="#087E80" stroke="none" stroke-width="1"/><rect x="770" y="519.5" width="7" height="21" rx="3" fill="#087E80" stroke="none" stroke-width="1"/><rect x="788" y="500.0" width="7" height="60" rx="3" fill="#087E80" stroke="none" stroke-width="1"/><rect x="806" y="511.5" width="7" height="37" rx="3" fill="#087E80" stroke="none" stroke-width="1"/><rect x="824" y="521.5" width="7" height="17" rx="3" fill="#087E80" stroke="none" stroke-width="1"/><text x="705" y="656" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="700" text-anchor="middle">00:42</text><text x="705" y="695" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Minimum time reached</text><text x="705" y="733" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle">You can stop when you are ready.</text><text x="705" y="755.5" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Recording stops at 02:00.</text><rect x="535" y="782" width="340" height="55" rx="13" fill="#087E80" stroke="none" stroke-width="1"/><text x="705.0" y="817" fill="white" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Stop and save</text><text x="705" y="879" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Cancel recording</text><text x="705" y="924" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Audio is being kept on this device.</text><rect x="960" y="190" width="390" height="800" rx="28" fill="#F3F6F8" stroke="#CFDCE3" stroke-width="2"/><text x="985" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="1325" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="end">●  ▰</text><text x="985" y="269" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">talk2me</text><text x="985" y="307" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Entry saved</text><rect x="1097" y="968" width="116" height="5" rx="3" fill="#152C3A" stroke="none" stroke-width="1"/><rect x="985" y="327" width="202" height="31" rx="15" fill="#E6F5F2" stroke="none" stroke-width="1"/><text x="1086.0" y="348" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SAVED ON THIS DEVICE</text><rect x="985" y="387" width="340" height="82" rx="14" fill="white" stroke="#CFDCE3" stroke-width="1"/><circle cx="1025" cy="428" r="23" fill="#E6F5F2" stroke="none" stroke-width="1"/><path d="M1019,417 L1019,439 L1036,428 Z" fill="#087E80"/><text x="1068" y="420" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">Your recording</text><text x="1068" y="447" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">00:42 · 26 October</text><text x="985" y="516" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="start">TRANSCRIPT</text><rect x="985" y="538" width="340" height="172" rx="14" fill="white" stroke="#CFDCE3" stroke-width="1"/><text x="1005" y="571" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Yesterday I go to the park. I</text><text x="1005" y="600.45" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">meet a friend and we have a</text><text x="1005" y="629.9000000000001" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">nice conversation.</text><text x="985" y="753" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">For feedback, your transcript and a short</text><text x="985" y="776.25" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">learner summary are sent for analysis. Your</text><text x="985" y="799.5" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">audio stays here.</text><rect x="985" y="845" width="340" height="55" rx="13" fill="#087E80" stroke="none" stroke-width="1"/><text x="1155.0" y="880" fill="white" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Get feedback</text><text x="1155" y="941" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Done for now</text><text x="60" y="1036" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">The saved screen completes UC-J01. “Get feedback” starts the separate feedback use case.</text><text x="60" y="1070" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Talk2Me  /  Draft 0.1  /  26 October 2026  /  Illustrative UI</text></svg>