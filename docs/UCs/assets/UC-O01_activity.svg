.15625" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="709" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[yes]</text><rect x="87" y="978" width="87.59375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="92" y="996" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[Back] A3</text><rect x="495" y="1052" width="117.9375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="500" y="1070" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[Finish setup]</text><rect x="1275" y="1152" width="104.9375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="1170" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">Save profile</text><rect x="995" y="1304" width="68.671875" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1000" y="1322" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[no] A5</text><rect x="1075" y="1574" width="95.453125" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1080" y="1592" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[Try again]</text><rect x="315" y="1679" width="65.921875" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="320" y="1697" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[leave]</text><rect x="1275" y="1412" width="50.15625" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="1430" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[yes]</text><text x="60" y="1877" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">This path starts without a completed profile. Returning learners reuse their saved profile in alternative A6 (Read).</text><text x="60" y="1907" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Not sure is a valid level choice. Cancellation/interruption and offline behaviour are detailed in §2.2.</text><text x="60" y="1937" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">All processing and storage shown here stay on the device; no login or AI request is performed.</text><text x="60" y="1975" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#536B78" text-anchor="start">Talk2Me · 27 October 2026 · RUP Use-Case Specification · Proposed behaviour</text></svg>