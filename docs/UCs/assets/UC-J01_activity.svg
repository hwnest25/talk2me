dth="42.4375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1010" y="1032" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[no]</text><rect x="1275" y="1122" width="50.15625" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="1140" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[yes]</text><rect x="1005" y="1434" width="42.4375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1010" y="1452" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[no]</text><rect x="1275" y="1542" width="187.53125" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="1560" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[yes] / Save transcript</text><rect x="1005" y="1724" width="42.4375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1010" y="1742" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[no]</text><rect x="1275" y="1852" width="50.15625" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="1870" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[yes]</text><text x="60" y="2347" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Precondition: onboarding is complete. A1/A5/A6 mark the matching alternative flows in the specification.</text><text x="60" y="2377" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Failure branches end this attempt; explicit retries, short recordings, cancellation and interruption are in §2.2.</text><text x="60" y="2407" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">All processing stays on-device. Receiving AI feedback is a separate use case.</text><text x="60" y="2445" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#536B78" text-anchor="start">Talk2Me · 27 October 2026 · RUP Use-Case Specification · Proposed behaviour</text></svg>