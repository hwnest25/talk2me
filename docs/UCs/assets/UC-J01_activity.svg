nd" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="470,885.0 580.0,930 470,975.0 360.0,930" fill="white" stroke="#526675" stroke-width="2"/><text x="470" y="936.12" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Saved?</text><path d="M580,930 L845,930" fill="none" stroke="#526675" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="630" y="916" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">[no] A5</text><rect x="845.0" y="887.0" width="430" height="86" rx="14" fill="#FFF3E4" stroke="#CFDCE3" stroke-width="1.6"/><text x="1060" y="923.3" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Show save failure; retain</text><text x="1060" y="950.3" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">recoverable work; offer retry</text><path d="M1060,973 L1060,1001" fill="none" stroke="#526675" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="1060" cy="1015" r="14" fill="white" stroke="#152C3A" stroke-width="2"/><circle cx="1060" cy="1015" r="8" fill="#152C3A" stroke="none" stroke-width="1"/><text x="1086" y="1021" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Not completed</text><path d="M470,975 L470,1020" fill="none" stroke="#526675" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="490" y="1003" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">[yes]</text><rect x="245.0" y="1020.0" width="450" height="80" rx="14" fill="#E6F5F2" stroke="#CFDCE3" stroke-width="1.6"/><text x="470" y="1053.3" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Transcribe audio on device</text><text x="470" y="1080.3" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">(included behaviour)</text><path d="M470,1100 L470,1155" fill="none" stroke="#526675" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="470,1155.0 590.0,1205 470,1255.0 350.0,1205" fill="white" stroke="#526675" stroke-width="2"/><text x="470" y="1199.62" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Non-empty</text><text x="470" y="1222.62" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">transcript?</text><path d="M590,1205 L845,1205" fill="none" stroke="#526675" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="630" y="1191" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">[no] A6</text><rect x="845.0" y="1160.0" width="430" height="90" rx="14" fill="#FFF3E4" stroke="#CFDCE3" stroke-width="1.6"/><text x="1060" y="1198.3" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Keep saved audio; mark pending;</text><text x="1060" y="1225.3" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">offer transcription retry</text><path d="M1060,1250 L1060,1291" fill="none" stroke="#526675" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="1060" cy="1305" r="14" fill="white" stroke="#152C3A" stroke-width="2"/><circle cx="1060" cy="1305" r="8" fill="#152C3A" stroke="none" stroke-width="1"/><text x="1086" y="1311" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Transcription pending