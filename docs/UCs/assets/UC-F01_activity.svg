400" fill="#17313E" text-anchor="middle">Choose Get feedback</text><rect x="1085.0" y="312.0" width="350" height="76" rx="14" fill="white" stroke="#B9CBD4" stroke-width="1.8"/><text x="1260" y="343.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Read entry, profile and</text><text x="1260" y="368.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">any saved feedback (device)</text><polygon points="1260,432.0 1370.0,480 1260,528.0 1150.0,480" fill="white" stroke="#536B78" stroke-width="2"/><text x="1260" y="474.28" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17313E" text-anchor="middle">Saved feedback</text><text x="1260" y="497.28" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17313E" text-anchor="middle">available?</text><rect x="605.0" y="442.0" width="350" height="76" rx="14" fill="white" stroke="#087E80" stroke-width="1.8"/><text x="780" y="486.12" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Show saved feedback (R)</text><rect x="125.0" y="582.0" width="350" height="76" rx="14" fill="white" stroke="#B9CBD4" stroke-width="1.8"/><text x="300" y="626.12" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Read saved suggestions</text><circle cx="300" cy="715" r="15" fill="white" stroke="#17313E" stroke-width="2"/><circle cx="300" cy="715" r="9" fill="#17313E"/><text x="327" y="720" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Feedback available</text><rect x="1085.0" y="582.0" width="350" height="76" rx="14" fill="white" stroke="#B9CBD4" stroke-width="1.8"/><text x="1260" y="626.12" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Check connectivity (device)</text><polygon points="1260,702.0 1370.0,750 1260,798.0 1150.0,750" fill="white" stroke="#536B78" stroke-width="2"/><text x="1260" y="755.78" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17313E" text-anchor="middle">Online?</text><rect x="605.0" y="712.0" width="350" height="76" rx="14" fill="white" stroke="#087E80" stroke-width="1.8"/><text x="780" y="743.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Show offline state; offer</text><text x="780" y="768.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">retry or return to journal (A3)</text><circle cx="780" cy="845" r="15" fill="white" stroke="#17313E" stroke-width="2"/><circle cx="780" cy="845" r="9" fill="#17313E"/><text x="807" y="850" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Deferred</text><rect x="605.0" y="912.0" width="350" height="76" rx="14" fill="white" stroke="#087E80" stroke-width="1.8"/><text x="780" y="943.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Show Preparing feedback;</text><text x="780" y="968.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">disable Get feedback</text><rect x="1085.0" y="1042.0" width="350" height="76" rx="14" fill="white" stroke="#B9CBD4" stroke-width="1.8"/><text x="1260" y="1073.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Send transcript + profile</text><text x="1260" y="1098.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">securely (device → server)</text><rect x="1085.0" y="1172.0" width="350" height="76" rx="14" fill="white" stroke="#B9CBD4" stroke-width="1.8"/><text x="1260" y="1203.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Request analysis; return result</text><text x="1260" y="1228.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">(server / external AI service)</text><rect x="1085.0" y="1302.0" width="350" height="76" rx="14" fill="white" stroke="#B9CBD4" stroke-width="1.8"/><text x="1260" y="1333.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Validate response</text><text x="1260" y="1358.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">(device)</text><polygon points="1260,1412.0 1370.0,1460 1260,1508.0 1150.0,1460" fill="white" stroke="#536B78" stroke-width="2"/><text x="1260" y="1454.28" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17313E" text-anchor="middle">Usable</text><text x="1260" y="1477.28" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17313E" text-anchor="middle">response?</text><rect x="605.0" y="1422.0" width="350" height="76" rx="14" fill="white" stroke="#087E80" stroke-width="1.8"/><text x="780" y="1453.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Explain request / data failure;</text><text x="780" y="1478.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">offer retry (A4)</text><circle cx="780" cy="1555" r="15" fill="white" stroke="#17313E" stroke-width="2"/><circle cx="780" cy="1555" r="9" fill="#17313E"/><text x="807" y="1560" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">No feedback saved</text><rect x="1085.0" y="1592.0" width="350" height="76" rx="14" fill="white" stroke="#B9CBD4" stroke-width="1.8"/><text x="1260" y="1623.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Save new feedback (C); update</text><text x="1260" y="1648.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">profile once (U) — device</text><polygon points="1260,1702.0 1370.0,1750 1260,1798.0 1150.0,1750" fill="white" stroke="#536B78" stroke-width="2"/><text x="1260" y="1744.28" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17313E" text-anchor="middle">Local save</text><text x="1260" y="1767.28" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17313E" text-anchor="middle">succeeded?</text><rect x="605.0" y="1712.0" width="350" height="76" rx="14" fill="white" stroke="#087E80" stroke-width="1.8"/><text x="780" y="1743.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Show result as unsaved;</text><text x="780" y="1768.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">offer local-save retry (A6)</text><circle cx="780" cy="1845" r="15" fill="white" stroke="#17313E" stroke-width="2"/><circle cx="780" cy="1845" r="9" fill="#17313E"/><text x="807" y="1850" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Unsaved result</text><rect x="605.0" y="1952.0" width="350" height="76" rx="14" fill="white" stroke="#087E80" stroke-width="1.8"/><text x="780" y="1983.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Show grammar and vocabulary</text><text x="780" y="2008.62" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">suggestions; allow empty lists</text><rect x="125.0" y="1952.0" width="350" height="76" rx="14" fill="white" stroke="#B9CBD4" stroke-width="1.8"/><text x="300" y="1996.12" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17313E" text-anchor="middle">Read new feedback</text><circle cx="300" cy="2085" r="15" fill="white" stroke="#17313E" stroke-width="2"/><circle cx="300" cy="2085" r="9" fill="#17313E"/><text x="327" y="2090" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Feedback available</text><rect x="975" y="444" width="103.09375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="980" y="462" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[yes] A1 / R</text><rect x="1275" y="542" width="42.4375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="560" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[no]</text><rect x="1005" y="714" width="42.4375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1010" y="732" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[no]</text><rect x="1275" y="827" width="50.15625" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="845" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[yes]</text><rect x="1005" y="1424" width="42.4375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1010" y="1442" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[no]</text><rect x="1275" y="1532" width="183.625" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="1550" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[yes] / Save feedback</text><rect x="1005" y="1714" width="42.4375" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1010" y="1732" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[no]</text><rect x="1275" y="1852" width="50.15625" height="24" rx="4" fill="white" stroke="none" stroke-width="1"/><text x="1280" y="1870" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536B78" text-anchor="start">[yes]</text><text x="60" y="2187" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Precondition: saved entry, non-empty transcript and local profile. New learning patterns update the profile once (U).</text><text x="60" y="2217" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Failure branches end this attempt. Retry, missing-transcript and leaving-screen behaviour are detailed in §2.2.</text><text x="60" y="2247" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#536B78" text-anchor="start">Only text and a profile summary reach the server / AI service. Audio, saved feedback and the profile stay on-device.</text><text x="60" y="2285" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#536B78" text-anchor="start">Talk2Me · 27 October 2026 · RUP Use-Case Specification · Proposed behaviour</text></svg>