<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <rect width="1100" height="860" fill="#f9f9fb"/>

  <!-- Title -->
  <text x="580" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Talk2Me — Overall Use Case Diagram</text>

  <!-- Legend -->
  <rect x="920" y="52" width="150" height="75" rx="8" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="995" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Legend</text>
  <ellipse cx="940" cy="87" rx="12" ry="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="958" y="91" font-size="10" fill="#333">Phase 1</text>
  <ellipse cx="940" cy="108" rx="12" ry="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="958" y="112" font-size="10" fill="#333">Phase 2</text>

  <!-- ══ System boundary ══ -->
  <rect x="200" y="50" width="700" height="790" rx="10" fill="white" stroke="#555" stroke-width="2"/>
  <text x="550" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Talk2Me</text>

  <!-- ══ ONBOARDING ══ -->
  <rect x="220" y="88" width="240" height="130" rx="6" fill="#f0f7ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="340" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Onboarding</text>
  <ellipse cx="340" cy="136" rx="95" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="340" y="140" text-anchor="middle" font-size="10" fill="#1e293b">Onboard and set up profile</text>
  <ellipse cx="340" cy="192" rx="85" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="340" y="196" text-anchor="middle" font-size="10" fill="#1e293b">Select target language</text>

  <!-- ══ JOURNAL ══ -->
  <rect x="530" y="88" width="350" height="130" rx="6" fill="#f0f7ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="705" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Journal</text>
  <ellipse cx="705" cy="136" rx="105" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="705" y="140" text-anchor="middle" font-size="10" fill="#1e293b">Record spoken journal entry</text>
  <ellipse cx="705" cy="192" rx="95" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="705" y="196" text-anchor="middle" font-size="10" fill="#1e293b">Select speaking prompt</text>

  <!-- ══ FEEDBACK ══ -->
  <rect x="220" y="242" width="240" height="130" rx="6" fill="#f0f7ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="340" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Feedback</text>
  <ellipse cx="340" cy="290" rx="100" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="340" y="294" text-anchor="middle" font-size="10" fill="#1e293b">Receive grammar feedback</text>
  <ellipse cx="340" cy="346" rx="105" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="340" y="350" text-anchor="middle" font-size="10" fill="#1e293b">Receive vocabulary feedback</text>

  <!-- ══ TRANSCRIPTION ══ -->
  <rect x="530" y="242" width="350" height="90" rx="6" fill="#f0f7ff" stroke="#93c5fd" stroke-width="1.3" stroke-dasharray="6,3"/>
  <text x="705" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Transcription</text>
  <ellipse cx="705" cy="300" rx="100" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="705" y="304" text-anchor="middle" font-size="10" fill="#1e293b">Transcribe audio entry</text>

  <!-- Include: UC3 -> UC7 — from bottom of Record oval to top of Transcribe oval, staying right of Select speaking prompt -->
  <path d="M800,136 C840,136 860,220 800,281" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="868" y="200" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">«include»</text>

  <!-- ══ PROGRESS ══ -->
  <rect x="220" y="398" width="660" height="160" rx="6" fill="#f0f7ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="550" y="416" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Progress</text>
  <ellipse cx="320" cy="452" rx="82" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="320" y="456" text-anchor="middle" font-size="10" fill="#1e293b">View entry history</text>
  <ellipse cx="550" cy="452" rx="82" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="550" y="456" text-anchor="middle" font-size="10" fill="#1e293b">View entry streak</text>
  <ellipse cx="780" cy="452" rx="82" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="780" y="456" text-anchor="middle" font-size="10" fill="#1e293b">View learner profile</text>
  <ellipse cx="440" cy="525" rx="105" ry="19" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="440" y="529" text-anchor="middle" font-size="10" fill="#1e293b">Review daily vocabulary list</text>

  <!-- ══ PHASE 2 FEATURES ══ -->
  <rect x="220" y="590" width="660" height="230" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="612" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">Phase 2 Features</text>
  <ellipse cx="355" cy="658" rx="115" ry="21" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="355" y="663" text-anchor="middle" font-size="10" fill="#1e293b">Sync learner profile across devices</text>
  <ellipse cx="710" cy="658" rx="85" ry="21" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="710" y="663" text-anchor="middle" font-size="10" fill="#1e293b">Set learning goals</text>
  <ellipse cx="355" cy="755" rx="115" ry="21" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="355" y="760" text-anchor="middle" font-size="10" fill="#1e293b">Configure feedback detail level</text>
  <ellipse cx="710" cy="755" rx="115" ry="21" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="710" y="760" text-anchor="middle" font-size="10" fill="#1e293b">Receive pronunciation feedback</text>

  <!-- ══ Actor: Learner ══ -->
  <circle cx="90" cy="370" r="20" fill="white" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="390" x2="90" y2="432" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="405" x2="70" y2="422" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="405" x2="110" y2="422" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="432" x2="72" y2="460" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="432" x2="108" y2="460" stroke="#333" stroke-width="2"/>
  <text x="90" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Learner</text>

  <!-- ══ Association lines ══
       All lines exit the actor at distinct y values and travel as clean
       curves to each oval's left edge. No line crosses any oval.

       Actor right edge: x≈110
       Onboarding ovals left edge: x≈245
       Feedback ovals left edge: x≈240
       Progress ovals: left edges at x≈238, 468, 698
       Phase 2 ovals: left edges at x≈240, 625
  -->

  <!-- Onboarding: UC1 (cy=136), UC2 (cy=192) -->
  <path d="M110,358 C155,280 200,136 245,136" fill="none" stroke="#555" stroke-width="1.2"/>
  <path d="M110,362 C155,300 200,192 245,192" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Journal: UC3 (cy=136), UC4 (cy=192) — arc above/through top -->
  <path d="M110,354 C155,240 400,100 600,136" fill="none" stroke="#555" stroke-width="1.2"/>
  <path d="M110,350 C155,230 400,90 610,192" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Feedback: UC5 (cy=290), UC6 (cy=346) -->
  <path d="M110,366 C155,330 200,290 240,290" fill="none" stroke="#555" stroke-width="1.2"/>
  <path d="M110,370 C155,355 200,346 235,346" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Progress: UC8 View entry history (cx=320,cy=452) left edge x=238 -->
  <path d="M110,374 C155,420 200,452 238,452" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Progress: UC9 View entry streak (cx=550,cy=452) — dips below history oval -->
  <path d="M110,378 C155,480 380,475 468,452" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Progress: UC10 View learner profile (cx=780,cy=452) -->
  <path d="M110,382 C155,490 500,490 698,452" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Progress: UC11 Review daily vocabulary list (cx=440,cy=525) left edge x=335 -->
  <path d="M110,386 C155,500 260,525 335,525" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Phase 2: UC12 Sync learner profile (cx=355,cy=658) left edge x=240 -->
  <path d="M110,390 C155,540 200,640 240,658" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Phase 2: UC13 Set learning goals (cx=710,cy=658) left edge x=625 -->
  <path d="M110,394 C155,550 420,640 625,658" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Phase 2: UC14 Configure feedback detail level (cx=355,cy=755) left edge x=240 -->
  <path d="M110,398 C155,560 200,730 240,755" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Phase 2: UC15 Receive pronunciation feedback (cx=710,cy=755) left edge x=595 -->
  <path d="M110,402 C155,570 420,730 595,755" fill="none" stroke="#555" stroke-width="1.2"/>

</svg>
