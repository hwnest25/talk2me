<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="1100" viewBox="0 0 1410 1100" role="img"><title>Talk2Me feedback mockup — processing, result and offline states</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#526675"/></marker></defs><rect x="0" y="0" width="1410" height="1100" rx="0" fill="white" stroke="none" stroke-width="1"/><rect x="48" y="44" width="8" height="54" rx="4" fill="#087E80" stroke="none" stroke-width="1"/><text x="76" y="79" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" text-anchor="start">Receive language feedback</text><text x="76" y="115" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">UC-F01 · One journal entry, grammar and vocabulary suggestions · Example content</text><text x="60" y="165" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">01  Request in progress</text><text x="510" y="165" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">02  Saved result</text><text x="960" y="165" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">03  Offline alternative</text><rect x="60" y="190" width="390" height="800" rx="28" fill="#F3F6F8" stroke="#CFDCE3" stroke-width="2"/><text x="85" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="425" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="end">●  ▰</text><text x="85" y="269" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">talk2me</text><text x="85" y="307" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Your feedback</text><text x="85" y="341" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">26 October · 00:42 entry</text><rect x="197" y="968" width="116" height="5" rx="3" fill="#152C3A" stroke="none" stroke-width="1"/><circle cx="255" cy="498" r="49" fill="none" stroke="#CFDCE3" stroke-width="7"/><path d="M255,449 A49,49 0 0 1 304,498" fill="none" stroke="#087E80" stroke-width="7" stroke-linecap="round"/><text x="255" y="603" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Preparing feedback</text><text x="255" y="646" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Looking at your grammar</text><text x="255" y="671.5" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">and vocabulary.</text><rect x="85" y="731" width="340" height="92" rx="14" fill="#E6F5F2" stroke="none" stroke-width="1"/><text x="105" y="764" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Your entry is saved. You can return to</text><text x="105" y="788.0" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">the journal while you wait.</text><rect x="85" y="866" width="340" height="55" rx="13" fill="white" stroke="#087E80" stroke-width="1"/><text x="255.0" y="901" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Back to journal</text><rect x="510" y="190" width="390" height="800" rx="28" fill="#F3F6F8" stroke="#CFDCE3" stroke-width="2"/><text x="535" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="875" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="end">●  ▰</text><text x="535" y="269" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">talk2me</text><text x="535" y="307" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Your feedback</text><rect x="647" y="968" width="116" height="5" rx="3" fill="#152C3A" stroke="none" stroke-width="1"/><rect x="535" y="327" width="202" height="31" rx="15" fill="#E6F5F2" stroke="none" stroke-width="1"/><text x="636.0" y="348" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SAVED ON THIS DEVICE</text><text x="535" y="398" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Grammar</text><text x="875" y="397" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="end">1 of 3</text><rect x="535" y="418" width="340" height="214" rx="14" fill="white" stroke="#CFDCE3" stroke-width="1"/><text x="553" y="448" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="start">YOU SAID</text><text x="553" y="479" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Yesterday I go to the park.</text><text x="553" y="515" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="start">SUGGESTION</text><text x="553" y="546" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start">Yesterday I went to the park.</text><text x="553" y="580" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Use “went” for a completed action in</text><text x="553" y="602.5" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">the past.</text><text x="535" y="673" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start">Vocabulary</text><rect x="535" y="695" width="340" height="128" rx="14" fill="white" stroke="#CFDCE3" stroke-width="1"/><text x="553" y="729" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">nice  →  enjoyable</text><text x="553" y="764" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">“We had an enjoyable conversation.”</text><text x="535" y="861" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">AI suggestions can be wrong.</text><text x="535" y="882.0" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Your original entry stays unchanged.</text><rect x="535" y="907" width="340" height="55" rx="13" fill="white" stroke="#087E80" stroke-width="1"/><text x="705.0" y="942" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Back to journal</text><rect x="960" y="190" width="390" height="800" rx="28" fill="#F3F6F8" stroke="#CFDCE3" stroke-width="2"/><text x="985" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="1325" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="end">●  ▰</text><text x="985" y="269" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">talk2me</text><text x="985" y="307" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Your feedback</text><text x="985" y="341" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">26 October · 00:42 entry</text><rect x="1097" y="968" width="116" height="5" rx="3" fill="#152C3A" stroke="none" stroke-width="1"/><circle cx="1155" cy="488" r="54" fill="#FFF3E4" stroke="none" stroke-width="1"/><text x="1155" y="503" fill="#9B5711" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700" text-anchor="middle">!</text><text x="1155" y="591" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle">You are offline</text><text x="1155" y="636" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Connect to the internet</text><text x="1155" y="661.5" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">to get new feedback.</text><rect x="985" y="719" width="340" height="80" rx="14" fill="#E6F5F2" stroke="none" stroke-width="1"/><text x="1005" y="749" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Your recording and transcript</text><text x="1005" y="771.5" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">are still saved on this device.</text><rect x="985" y="838" width="340" height="55" rx="13" fill="#087E80" stroke="none" stroke-width="1"/><text x="1155.0" y="873" fill="white" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Try again</text><text x="1155" y="938" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Back to journal</text><text x="60" y="1036" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Both feedback categories belong to one result. Existing saved feedback can be opened offline.</text><text x="60" y="1070" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Talk2Me  /  Draft 0.1  /  26 October 2026  /  Illustrative UI</text></svg>