<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="1100" viewBox="0 0 1410 1100" role="img"><title>Talk2Me profile setup mockup — choices, privacy and success</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#526675"/></marker></defs><rect x="0" y="0" width="1410" height="1100" rx="0" fill="white" stroke="none" stroke-width="1"/><rect x="48" y="44" width="8" height="54" rx="4" fill="#087E80" stroke="none" stroke-width="1"/><text x="76" y="79" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" text-anchor="start">Set up a learner profile</text><text x="76" y="115" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">UC-O01 · Create (C) · One initial local profile · Proposed onboarding flow</text><text x="60" y="165" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">01  Choose your starting point</text><text x="510" y="165" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">02  Understand data use</text><text x="960" y="165" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">03  Ready to journal</text><rect x="60" y="190" width="390" height="800" rx="28" fill="#F3F6F8" stroke="#CFDCE3" stroke-width="2"/><text x="85" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="425" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="end">●  ▰</text><text x="85" y="269" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">talk2me</text><text x="85" y="307" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Welcome to Talk2Me</text><text x="85" y="341" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Step 1 of 2 · Your profile</text><rect x="197" y="968" width="116" height="5" rx="3" fill="#152C3A" stroke="none" stroke-width="1"/><text x="85" y="401" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">A few choices to get you</text><text x="85" y="429.5" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">started.</text><text x="85" y="461" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">I want to practise</text><rect x="85" y="477" width="340" height="60" rx="12" fill="white" stroke="#CFDCE3" stroke-width="1"/><text x="103" y="515" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">English</text><path d="M394,501 L401,508 L408,501" fill="none" stroke="#526675" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="563" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Choose the language for your spoken entries.</text><text x="85" y="629" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">My current level</text><rect x="85" y="645" width="340" height="60" rx="12" fill="white" stroke="#CFDCE3" stroke-width="1"/><text x="103" y="683" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Intermediate</text><path d="M394,669 L401,676 L408,669" fill="none" stroke="#526675" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="731" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Beginner · Intermediate · Advanced</text><text x="85" y="752.0" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Not sure is also a valid choice.</text><rect x="85" y="803" width="340" height="55" rx="13" fill="#087E80" stroke="none" stroke-width="1"/><text x="255.0" y="838" fill="white" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Continue</text><text x="85" y="902" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Your choices are saved when you finish</text><text x="85" y="924.5" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">setup.</text><rect x="510" y="190" width="390" height="800" rx="28" fill="#F3F6F8" stroke="#CFDCE3" stroke-width="2"/><text x="535" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="875" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="end">●  ▰</text><text x="535" y="269" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">talk2me</text><text x="535" y="307" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Before you start</text><text x="535" y="341" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Step 2 of 2 · Your data</text><rect x="647" y="968" width="116" height="5" rx="3" fill="#152C3A" stroke="none" stroke-width="1"/><text x="535" y="397" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">Your audio stays here</text><text x="535" y="429" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Recordings stay on your device.</text><text x="535" y="500" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">Feedback uses text</text><text x="535" y="532" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">When you request AI feedback, your</text><text x="535" y="555.2" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">transcript and a short learner summary</text><text x="535" y="578.4000000000001" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">are sent for analysis.</text><text x="535" y="643" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">Keep personal details out</text><text x="535" y="675" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Avoid sensitive personal information in</text><text x="535" y="698.2" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">your entries.</text><text x="535" y="750" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Our server deletes submitted text after</text><text x="535" y="771.0" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">analysis.</text><rect x="535" y="831" width="340" height="55" rx="13" fill="#087E80" stroke="none" stroke-width="1"/><text x="705.0" y="866" fill="white" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Finish setup</text><text x="705" y="928" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Back</text><rect x="960" y="190" width="390" height="800" rx="28" fill="#F3F6F8" stroke="#CFDCE3" stroke-width="2"/><text x="985" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="1325" y="223" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="end">●  ▰</text><text x="985" y="269" fill="#087E80" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start">talk2me</text><text x="985" y="307" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Your journal</text><text x="985" y="341" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Profile created on this device</text><rect x="1097" y="968" width="116" height="5" rx="3" fill="#152C3A" stroke="none" stroke-width="1"/><circle cx="1155" cy="426" r="42" fill="#E6F5F2" stroke="none" stroke-width="1"/><path d="M1135,425 L1149,439 L1177,410" fill="none" stroke="#087E80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1155" y="513" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle">You are ready</text><rect x="985" y="550" width="340" height="128" rx="14" fill="white" stroke="#CFDCE3" stroke-width="1"/><text x="1005" y="586" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="start">YOUR STARTING PROFILE</text><text x="1005" y="621" fill="#152C3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">English · Intermediate</text><text x="1005" y="655" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">No entries yet</text><text x="985" y="733" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Record your first spoken entry</text><text x="985" y="758.5" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">whenever you are ready.</text><rect x="985" y="831" width="340" height="55" rx="13" fill="#087E80" stroke="none" stroke-width="1"/><text x="1155.0" y="866" fill="white" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Record</text><text x="1155" y="928" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Your profile setup is complete.</text><text x="60" y="1038" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">“Finish setup” creates the profile. “Record” begins UC-J01 after onboarding is complete.</text><text x="60" y="1070" fill="#526675" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Talk2Me  /  UC-O01  /  Draft 0.1  /  27 October 2026  /  Illustrative UI</text></svg>